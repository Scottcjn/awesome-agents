name: Catalog checks

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "BCOS.md"
      - "LICENSE"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/catalog-check.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "BCOS.md"
      - "LICENSE"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/catalog-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Run catalog checks
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/check_catalog.py
